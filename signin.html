<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | AI Interior Studio - User & Admin Access</title>
  <link rel="stylesheet" href="css/login.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    /* Explicit Interactive Controls */
    .auth-tab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .auth-tab-btn.active.admin-active {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      color: #fff !important;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4) !important;
    }
    .auth-tab-btn.active.user-active {
      background: linear-gradient(135deg, #6366f1, #4f46e5) !important;
      color: #fff !important;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4) !important;
    }
    .auth-input-wrapper {
      position: relative !important;
      display: flex !important;
      align-items: center !important;
      width: 100% !important;
    }
    .auth-input {
      cursor: text !important;
      pointer-events: auto !important;
      user-select: text !important;
      position: relative !important;
      z-index: 2 !important;
    }
    .btn-pwd-toggle {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      z-index: 10;
    }
    .btn-pwd-toggle:hover {
      color: #fff;
    }
    .quick-chip {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .quick-chip:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <!-- Background 3D Canvas -->
  <canvas id="auth-canvas"></canvas>

  <!-- Glowing ambient blur orbs -->
  <div class="auth-glow-orb-1"></div>
  <div class="auth-glow-orb-2"></div>

  <!-- Top Navigation -->
  <header class="auth-nav">
    <a href="index.html" class="auth-back-link">
      <span>←</span> Back to Showcase
    </a>
    <div style="display: flex; gap: 10px; align-items: center;">
      <a href="signup.html" class="auth-back-link" style="background: rgba(99, 102, 241, 0.2); border-color: rgba(99, 102, 241, 0.4); color: #fff;">
        <span>✨</span> Sign Up
      </a>
    </div>
  </header>

  <!-- Auth Main Centerpiece -->
  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 460px;">

      <!-- Dual Login Switcher: User Login vs Admin Login -->
      <div class="auth-tabs" id="login-role-tabs" style="margin-bottom: 22px;">
        <button type="button" class="auth-tab-btn active user-active" id="tab-user-btn" data-role="user">
          <span>👤</span> User Login
        </button>
        <button type="button" class="auth-tab-btn" id="tab-admin-btn" data-role="admin">
          <span>👑</span> Admin Login
        </button>
      </div>

      <!-- Brand Header -->
      <div class="auth-header" style="margin-bottom: 20px;">
        <div class="auth-brand-badge" id="portal-badge">✨</div>
        <h1 class="auth-title" id="auth-main-title">User Sign In</h1>
        <p class="auth-subtitle" id="auth-main-subtitle">
          Sign in to design, customize, and view interior spaces in 3D.
        </p>
      </div>

      <!-- Status Alert Box (High Visibility) -->
      <div id="auth-alert-box" style="display: none; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; margin-bottom: 16px; text-align: center; line-height: 1.4;">
      </div>

      <!-- Main Sign In Form -->
      <form class="auth-form" id="signin-form" autocomplete="on">
        
        <div class="auth-field">
          <label class="auth-label" for="signin-email" id="email-field-label">Email Address</label>
          <div class="auth-input-wrapper">
            <span class="auth-input-icon" id="email-field-icon">✉️</span>
            <input 
              type="email" 
              id="signin-email" 
              class="auth-input" 
              placeholder="sarah.miller@example.com" 
              required 
              autocomplete="email"
              value=""
            >
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="signin-password" id="password-field-label">Password</label>
          <div class="auth-input-wrapper">
            <span class="auth-input-icon">🔒</span>
            <input 
              type="password" 
              id="signin-password" 
              class="auth-input" 
              placeholder="Enter password" 
              required 
              autocomplete="current-password"
              value=""
            >
            <button type="button" class="btn-pwd-toggle" id="btn-toggle-pwd" title="Show/Hide Password">👁</button>
          </div>
        </div>

        <!-- Quick 1-Click Auto-Fill Helpers -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 4px 0 10px;">
          <button type="button" class="quick-chip" id="btn-quick-fill">
            <span id="quick-fill-icon">⚡</span> <span id="quick-fill-text">1-Click Fill Demo Credentials</span>
          </button>
          <a href="#" class="auth-forgot-link" id="link-forgot-pwd" style="color: #a5b4fc; text-decoration: none; font-size: 12px;">Forgot?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="auth-submit-btn" id="btn-submit-signin">
          <span id="submit-icon">🚀</span> <span id="submit-label">Sign In & Launch Studio</span>
        </button>
      </form>

      <!-- Switch to Sign Up (Shown for User tab) -->
      <div id="signup-switch-row" style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-dim);">
        Don't have an account yet? 
        <a href="signup.html" style="color: var(--accent-primary); font-weight: 600; text-decoration: none; margin-left: 4px;">
          Create Free Account →
        </a>
      </div>

      <!-- Admin Secure Notice (Shown for Admin tab) -->
      <div id="admin-security-note" style="display: none; text-align: center; margin-top: 18px; font-size: 12px; color: #94a3b8; background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.2); padding: 8px 12px; border-radius: 8px;">
        🔒 <strong>Restricted Admin Portal:</strong> Authorized studio administrators only.
      </div>

    </div>
  </div>

  <!-- Toast Notification (Secondary) -->
  <div class="auth-toast" id="auth-toast">
    <span id="toast-icon">✨</span>
    <span id="toast-msg">Welcome to AI Interior Studio!</span>
  </div>

  <!-- Primary User Database Service -->
  <script src="js/user-db.js"></script>

  <script>
    // Fail-Safe UserDB Fallback if file load fails
    if (typeof window.UserDB === 'undefined' || !window.UserDB.authenticateUser) {
      window.UserDB = {
        STORAGE_KEY: 'ai_interior_users_db',
        SESSION_KEY: 'ai_interior_user',
        ADMIN_EMAIL: 'bhuvan@gmail.com',
        ADMIN_PASSWORD: 'Bhuvan@123',
        getUsers: function() {
          let users = [];
          try {
            const raw = localStorage.getItem(this.STORAGE_KEY);
            if (raw) users = JSON.parse(raw);
          } catch(e) {}
          if (!Array.isArray(users) || users.length === 0) {
            users = [
              { id: 'usr_admin', name: 'Bhuvan (Admin)', email: 'bhuvan@gmail.com', password: 'Bhuvan@123', role: 'admin', registeredAt: '2026-11-01T08:00:00.000Z', loginCount: 1, status: 'active' },
              { id: 'usr_sarah', name: 'Sarah Miller', email: 'sarah.miller@example.com', password: 'password123', role: 'user', registeredAt: '2026-11-02T10:00:00.000Z', loginCount: 1, status: 'active' }
            ];
            try { localStorage.setItem(this.STORAGE_KEY, JSON.stringify(users)); } catch(e) {}
          }
          return users;
        },
        setCurrentUser: function(user) {
          try { localStorage.setItem(this.SESSION_KEY, JSON.stringify(user)); } catch(e) {}
        },
        authenticateUser: function(email, password) {
          const cleanEmail = (email || '').trim().toLowerCase();
          const cleanPassword = (password || '').trim();
          if (!cleanEmail || !cleanPassword) return { success: false, error: 'Please enter both email and password.' };

          // Admin check (Bhuvan@123 or bhuvan@123)
          if (cleanEmail === this.ADMIN_EMAIL.toLowerCase()) {
            if (cleanPassword === 'Bhuvan@123' || cleanPassword === 'bhuvan@123') {
              const adminUser = { id: 'usr_admin', name: 'Bhuvan (Admin)', email: this.ADMIN_EMAIL, role: 'admin', registeredAt: '2026-11-01T08:00:00.000Z', loginCount: 2, status: 'active' };
              this.setCurrentUser(adminUser);
              return { success: true, user: adminUser };
            } else {
              return { success: false, error: 'Incorrect administrator password.' };
            }
          }

          // User check
          const users = this.getUsers();
          let user = users.find(u => (u.email || '').toLowerCase() === cleanEmail);
          if (!user) {
            // Auto register on the fly
            user = { id: 'usr_' + Date.now(), name: cleanEmail.split('@')[0], email: cleanEmail, password: cleanPassword, role: 'user', registeredAt: new Date().toISOString(), loginCount: 1, status: 'active' };
            users.unshift(user);
            try { localStorage.setItem(this.STORAGE_KEY, JSON.stringify(users)); } catch(e) {}
            this.setCurrentUser(user);
            return { success: true, user: user };
          }

          if (user.password !== cleanPassword && user.password.toLowerCase() !== cleanPassword.toLowerCase()) {
            return { success: false, error: 'Incorrect password. Please try again.' };
          }

          this.setCurrentUser(user);
          return { success: true, user: user };
        }
      };
    }

    const UserDB = window.UserDB;
    let activeRoleTab = 'user'; // 'user' | 'admin'

    // 3D Three.js Background
    function initBackground() {
      const canvas = document.getElementById('auth-canvas');
      if (!canvas || typeof THREE === 'undefined') return;

      try {
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 7);

        const group = new THREE.Group();
        scene.add(group);

        const boxGeom = new THREE.BoxGeometry(2.4, 2.4, 2.4);
        const wireMat = new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true, transparent: true, opacity: 0.25 });
        const cube = new THREE.Mesh(boxGeom, wireMat);
        group.add(cube);

        const ringGeom = new THREE.TorusGeometry(2.0, 0.02, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xec4899, transparent: true, opacity: 0.3 });
        const ring = new THREE.Mesh(ringGeom, ringMat);
        ring.rotation.x = Math.PI / 3;
        group.add(ring);

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
          requestAnimationFrame(animate);
          group.rotation.x += 0.003;
          group.rotation.y += 0.005;
          renderer.render(scene, camera);
        }
        animate();
      } catch(e) {}
    }

    // High-Visibility In-Card Alert Box
    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('auth-alert-box');
      if (!box) return;
      box.textContent = msg;
      if (isSuccess) {
        box.style.display = 'block';
        box.style.background = 'rgba(16, 185, 129, 0.18)';
        box.style.border = '1px solid rgba(16, 185, 129, 0.5)';
        box.style.color = '#34d399';
      } else {
        box.style.display = 'block';
        box.style.background = 'rgba(239, 68, 68, 0.18)';
        box.style.border = '1px solid rgba(239, 68, 68, 0.5)';
        box.style.color = '#fca5a5';
      }
    }

    function hideAlert() {
      const box = document.getElementById('auth-alert-box');
      if (box) box.style.display = 'none';
    }

    // Role Tab Switcher: User vs Admin
    function setRoleTab(role) {
      activeRoleTab = role;
      hideAlert();

      const userBtn = document.getElementById('tab-user-btn');
      const adminBtn = document.getElementById('tab-admin-btn');
      const title = document.getElementById('auth-main-title');
      const subtitle = document.getElementById('auth-main-subtitle');
      const badge = document.getElementById('portal-badge');
      const emailLabel = document.getElementById('email-field-label');
      const emailInput = document.getElementById('signin-email');
      const pwdInput = document.getElementById('signin-password');
      const submitLabel = document.getElementById('submit-label');
      const submitIcon = document.getElementById('submit-icon');
      const submitBtn = document.getElementById('btn-submit-signin');
      const signupRow = document.getElementById('signup-switch-row');
      const adminNote = document.getElementById('admin-security-note');
      const quickFillText = document.getElementById('quick-fill-text');

      if (role === 'admin') {
        userBtn.className = 'auth-tab-btn';
        adminBtn.className = 'auth-tab-btn active admin-active';
        badge.textContent = '👑';
        badge.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
        title.textContent = 'Administrator Sign In';
        subtitle.textContent = 'Enter admin credentials to manage users and access records.';
        emailLabel.textContent = 'Administrator Email';
        emailInput.placeholder = 'bhuvan@gmail.com';
        submitLabel.textContent = 'Sign In to Admin Dashboard';
        submitIcon.textContent = '👑';
        submitBtn.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
        signupRow.style.display = 'none';
        adminNote.style.display = 'block';
        if (quickFillText) quickFillText.textContent = '1-Click Fill Admin Credentials';
      } else {
        adminBtn.className = 'auth-tab-btn';
        userBtn.className = 'auth-tab-btn active user-active';
        badge.textContent = '✨';
        badge.style.background = 'var(--gradient-brand)';
        title.textContent = 'User Sign In';
        subtitle.textContent = 'Sign in to design, customize, and view interior spaces in 3D.';
        emailLabel.textContent = 'Email Address';
        emailInput.placeholder = 'sarah.miller@example.com';
        submitLabel.textContent = 'Sign In & Launch Studio';
        submitIcon.textContent = '🚀';
        submitBtn.style.background = 'var(--gradient-brand)';
        signupRow.style.display = 'block';
        adminNote.style.display = 'none';
        if (quickFillText) quickFillText.textContent = '1-Click Fill User Credentials';
      }
    }

    // Quick Fill Helper
    function handleQuickFill() {
      hideAlert();
      const emailInput = document.getElementById('signin-email');
      const pwdInput = document.getElementById('signin-password');
      if (activeRoleTab === 'admin') {
        emailInput.value = 'bhuvan@gmail.com';
        pwdInput.value = 'Bhuvan@123';
        showAlert('Admin credentials filled: bhuvan@gmail.com / Bhuvan@123. Click Sign In below!', true);
      } else {
        emailInput.value = 'sarah.miller@example.com';
        pwdInput.value = 'password123';
        showAlert('User credentials filled: sarah.miller@example.com / password123. Click Sign In below!', true);
      }
    }

    // Process Login Submission
    function handleLoginSubmit() {
      hideAlert();
      const emailEl = document.getElementById('signin-email');
      const pwdEl = document.getElementById('signin-password');
      const email = emailEl ? emailEl.value.trim() : '';
      const password = pwdEl ? pwdEl.value.trim() : '';

      if (!email) {
        showAlert('Please enter your email address.', false);
        if (emailEl) emailEl.focus();
        return;
      }

      if (!password) {
        showAlert('Please enter your password.', false);
        if (pwdEl) pwdEl.focus();
        return;
      }

      const submitBtn = document.getElementById('btn-submit-signin');
      const submitLabel = document.getElementById('submit-label');
      if (submitBtn) submitBtn.disabled = true;
      if (submitLabel) submitLabel.textContent = 'Signing In...';

      // Authenticate
      const result = UserDB.authenticateUser(email, password);

      if (result.success) {
        const user = result.user;
        const isAdmin = user.role === 'admin' || user.email.toLowerCase() === 'bhuvan@gmail.com';

        if (isAdmin) {
          showAlert(`✨ Administrator Verified! Welcome, ${user.name}. Opening Admin Dashboard...`, true);
          setTimeout(() => {
            window.location.href = 'admin.html';
          }, 400);
        } else {
          showAlert(`✨ Welcome, ${user.name}! Launching 3D Interior Studio...`, true);
          setTimeout(() => {
            window.location.href = 'studio.html';
          }, 400);
        }
      } else {
        if (submitBtn) submitBtn.disabled = false;
        if (submitLabel) submitLabel.textContent = activeRoleTab === 'admin' ? 'Sign In to Admin Dashboard' : 'Sign In & Launch Studio';
        showAlert(`⚠️ ${result.error || 'Authentication failed. Please check email and password.'}`, false);
      }
    }

    // Initialize Page Controller
    window.addEventListener('DOMContentLoaded', () => {
      initBackground();

      const params = new URLSearchParams(window.location.search);
      const roleParam = params.get('role');

      if (roleParam === 'admin' || params.get('redirect') === 'admin.html') {
        setRoleTab('admin');
      } else {
        setRoleTab('user');
      }

      if (params.get('error') === 'admin_required') {
        setRoleTab('admin');
        showAlert('⚠️ Administrator privileges required. Please sign in as Admin.', false);
      }

      // Tab switcher listeners
      document.getElementById('tab-user-btn')?.addEventListener('click', () => setRoleTab('user'));
      document.getElementById('tab-admin-btn')?.addEventListener('click', () => setRoleTab('admin'));

      // Quick 1-click fill button
      document.getElementById('btn-quick-fill')?.addEventListener('click', handleQuickFill);

      // Password toggle
      const pwdInput = document.getElementById('signin-password');
      const pwdToggle = document.getElementById('btn-toggle-pwd');
      pwdToggle?.addEventListener('click', (e) => {
        e.preventDefault();
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        pwdToggle.textContent = isPwd ? '🙈' : '👁';
      });

      // Form submission
      const form = document.getElementById('signin-form');
      form?.addEventListener('submit', (e) => {
        e.preventDefault();
        handleLoginSubmit();
      });

      // Direct button click fallback
      document.getElementById('btn-submit-signin')?.addEventListener('click', (e) => {
        e.preventDefault();
        handleLoginSubmit();
      });

      // Forgot password
      document.getElementById('link-forgot-pwd')?.addEventListener('click', (e) => {
        e.preventDefault();
        const email = document.getElementById('signin-email').value.trim();
        if (!email) {
          showAlert('Please type your email address into the box first.', false);
          return;
        }
        showAlert(`Password reset link has been sent to ${email}`, true);
      });
    });
  </script>

</body>
</html>
