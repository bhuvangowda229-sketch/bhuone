<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | AI Interior Studio - 3D Spatial Suggester</title>
  <link rel="stylesheet" href="css/login.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Background 3D Canvas -->
  <canvas id="auth-canvas"></canvas>

  <!-- Glowing ambient blur orbs -->
  <div class="auth-glow-orb-1"></div>
  <div class="auth-glow-orb-2"></div>

  <!-- Top Navigation -->
  <header class="auth-nav">
    <a href="index.html" class="auth-back-link">
      <span>←</span> Back to Showcase
    </a>
    <div style="display: flex; gap: 10px; align-items: center;">
      <a href="signup.html" class="auth-back-link" style="background: rgba(99, 102, 241, 0.2); border-color: rgba(99, 102, 241, 0.4); color: #fff;">
        <span>✨</span> Sign Up
      </a>
    </div>
  </header>

  <!-- Auth Main Centerpiece -->
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Brand Header -->
      <div class="auth-header">
        <div class="auth-brand-badge">✨</div>
        <h1 class="auth-title" id="auth-main-title">Sign In to 3D Studio</h1>
        <p class="auth-subtitle" id="auth-main-subtitle">
          Please sign in to proceed into the interactive 3D Design Studio.
        </p>
      </div>

      <!-- Active Session Notice (Subtle, non-blocking) -->
      <div id="active-session-banner" style="display: none; margin-bottom: 20px; padding: 12px 16px; background: rgba(99, 102, 241, 0.12); border: 1px solid rgba(99, 102, 241, 0.35); border-radius: 12px; font-size: 13px; color: #cbd5e1; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 18px;">👤</span>
          <div>
            <div style="font-weight: 600; color: #fff;" id="active-banner-name">User</div>
            <div style="font-size: 11px; color: #94a3b8;" id="active-banner-email">user@example.com</div>
          </div>
        </div>
        <div style="display: flex; gap: 8px;">
          <a href="studio.html" id="btn-active-go-studio" class="btn btn-sm" style="padding: 5px 10px; font-size: 11px; text-decoration: none; background: #6366f1; color: #fff;">
            Continue →
          </a>
          <button type="button" id="btn-active-signout" class="btn btn-sm" style="padding: 5px 10px; font-size: 11px; border-color: rgba(239, 68, 68, 0.4); color: #fca5a5;">
            Sign Out
          </button>
        </div>
      </div>

      <!-- Main Sign In Form -->
      <div id="auth-forms-container">
        <form class="auth-form" id="signin-form" autocomplete="on">
          
          <div class="auth-field">
            <label class="auth-label" for="signin-email">Email Address</label>
            <div class="auth-input-wrapper">
              <span class="auth-input-icon">✉️</span>
              <input 
                type="email" 
                id="signin-email" 
                class="auth-input" 
                placeholder="Enter your email" 
                required 
                autocomplete="email"
              >
            </div>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="signin-password">Password</label>
            <div class="auth-input-wrapper">
              <span class="auth-input-icon">🔒</span>
              <input 
                type="password" 
                id="signin-password" 
                class="auth-input" 
                placeholder="Enter your password" 
                required 
                autocomplete="current-password"
              >
              <button type="button" class="btn-pwd-toggle" id="btn-toggle-pwd" title="Show/Hide Password">👁</button>
            </div>
          </div>

          <!-- Options Row: Remember Me & Forgot Password -->
          <div class="auth-options" id="auth-options-row">
            <label class="auth-remember">
              <input type="checkbox" id="remember-me" checked>
              <span>Remember me</span>
            </label>
            <a href="#" class="auth-forgot" id="link-forgot-pwd">Forgot password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="auth-submit-btn" id="btn-submit-signin">
            <span>🚀</span> <span id="submit-label">Sign In & Launch Studio</span>
          </button>
        </form>

        <!-- Switch to Sign Up -->
        <div style="text-align: center; margin-top: 22px; font-size: 13px; color: var(--text-dim);">
          Don't have an account yet? 
          <a href="signup.html" style="color: var(--accent-primary); font-weight: 600; text-decoration: none; margin-left: 4px;">
            Create Free Account →
          </a>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast Notification -->
  <div class="auth-toast" id="auth-toast">
    <span id="toast-icon">✨</span>
    <span id="toast-msg">Welcome to AI Interior Studio!</span>
  </div>

  <script src="js/user-db.js"></script>
  <script>
    const UserDB = window.UserDB;

    // 3D Three.js Background
    function initBackground() {
      const canvas = document.getElementById('auth-canvas');
      if (!canvas || typeof THREE === 'undefined') return;

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 7);

      const group = new THREE.Group();
      scene.add(group);

      const boxGeom = new THREE.BoxGeometry(2.4, 2.4, 2.4);
      const wireMat = new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true, transparent: true, opacity: 0.25 });
      const cube = new THREE.Mesh(boxGeom, wireMat);
      group.add(cube);

      const ringGeom = new THREE.TorusGeometry(2.0, 0.02, 16, 100);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xec4899, transparent: true, opacity: 0.3 });
      const ring = new THREE.Mesh(ringGeom, ringMat);
      ring.rotation.x = Math.PI / 3;
      group.add(ring);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        group.rotation.x += 0.003;
        group.rotation.y += 0.005;
        renderer.render(scene, camera);
      }
      animate();
    }

    // UI Toast
    function showToast(msg, isSuccess = true) {
      const toast = document.getElementById('auth-toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');
      if (!toast) return;
      toastMsg.textContent = msg;
      toastIcon.textContent = isSuccess ? '✨' : '⚠️';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // Initialize Page Controller
    window.addEventListener('DOMContentLoaded', () => {
      initBackground();

      const params = new URLSearchParams(window.location.search);
      const redirectUrl = params.get('redirect') || 'studio.html';

      // Check if admin was required
      if (params.get('error') === 'admin_required') {
        showToast('Administrator privileges required. Please sign in as Admin.', false);
      }

      // Check existing session (show subtle banner without hiding the form)
      const currentUser = UserDB.getCurrentUser();
      const banner = document.getElementById('active-session-banner');
      const bannerName = document.getElementById('active-banner-name');
      const bannerEmail = document.getElementById('active-banner-email');

      if (currentUser && currentUser.name) {
        if (banner) {
          bannerName.textContent = currentUser.name;
          bannerEmail.textContent = currentUser.email || 'Active Account';
          banner.style.display = 'flex';
          
          // Pre-fill email
          const emailInput = document.getElementById('signin-email');
          if (emailInput && !emailInput.value) {
            emailInput.value = currentUser.email || '';
          }
        }
      }

      // Active banner sign out
      document.getElementById('btn-active-signout')?.addEventListener('click', () => {
        UserDB.signOut();
        banner.style.display = 'none';
        document.getElementById('signin-email').value = '';
        document.getElementById('signin-password').value = '';
        showToast('Signed out of previous session.');
      });

      // Password Toggle
      const pwdInput = document.getElementById('signin-password');
      const pwdToggle = document.getElementById('btn-toggle-pwd');
      pwdToggle?.addEventListener('click', () => {
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        pwdToggle.textContent = isPwd ? '🙈' : '👁';
      });

      // Sign In Form Submission
      const form = document.getElementById('signin-form');
      form?.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('signin-email').value.trim();
        const password = document.getElementById('signin-password').value;

        const result = UserDB.authenticateUser(email, password);
        if (result.success) {
          showToast(`Welcome back, ${result.user.name}! Proceeding...`, true);
          
          // Determine target destination
          let destination = redirectUrl;
          if (result.user.role === 'admin') {
            // Admin destination: admin.html if directly accessed or requested, else studio.html
            destination = (!params.get('redirect') || params.get('redirect') === 'admin.html') ? 'admin.html' : redirectUrl;
          }

          setTimeout(() => {
            window.location.href = destination;
          }, 600);
        } else {
          showToast(result.error || 'Authentication failed', false);
        }
      });

      // Forgot Password
      document.getElementById('link-forgot-pwd')?.addEventListener('click', (e) => {
        e.preventDefault();
        const email = document.getElementById('signin-email').value.trim();
        if (!email) {
          showToast('Please type your email above first.', false);
          return;
        }
        showToast(`Password reset link sent to ${email}`, true);
      });
    });
  </script>

</body>
</html>
