<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | AI Interior Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0b0f19;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .bg-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
    }

    .top-nav {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .nav-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s;
    }
    .nav-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      margin-top: 40px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #10b981, #059669);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #94a3b8;
    }

    .status-msg {
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 18px;
      display: none;
      line-height: 1.4;
    }

    .status-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .status-msg.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      font-size: 16px;
      color: #64748b;
      pointer-events: none;
    }

    .text-input {
      width: 100%;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 11px 14px 11px 42px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: all 0.2s;
    }

    .text-input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #10b981;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      margin-top: 18px;
      transition: all 0.2s;
    }

    .submit-btn:hover {
      background: #059669;
    }

    .bottom-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #94a3b8;
    }

    .bottom-link a {
      color: #34d399;
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
    }

    .bottom-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- Top Nav -->
  <header class="top-nav">
    <a href="index.html" class="nav-link">
      <span>←</span> Back to Showcase
    </a>
    <a href="login.html" class="nav-link" style="color: #6ee7b7; border-color: rgba(16, 185, 129, 0.3);">
      Sign In
    </a>
  </header>

  <!-- Card -->
  <div class="card">

    <div class="brand-header">
      <div class="brand-icon">✨</div>
      <h1 class="brand-title">Create Account</h1>
      <p class="brand-subtitle">Join AI Interior Studio & save custom 3D layouts</p>
    </div>

    <div class="status-msg" id="status-box"></div>

    <form id="signup-form">

      <div class="form-group">
        <label class="form-label" for="reg-name">Full Name</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="reg-name" class="text-input" placeholder="e.g. Maya Lin" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input type="email" id="reg-email" class="text-input" placeholder="maya@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="reg-password" class="text-input" placeholder="At least 4 characters" minlength="4" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-confirm">Confirm Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="reg-confirm" class="text-input" placeholder="Repeat password" minlength="4" required>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="btn-submit">
        <span>🚀</span> Create Account & Launch Studio
      </button>

    </form>

    <div class="bottom-link">
      Already have an account? 
      <a href="login.html">Sign In here →</a>
    </div>

  </div>

  <script src="js/user-db.js"></script>

  <script>
    function showStatus(text, isSuccess) {
      var box = document.getElementById('status-box');
      box.textContent = text;
      box.className = 'status-msg ' + (isSuccess ? 'success' : 'error');
    }

    document.getElementById('signup-form').addEventListener('submit', function(e) {
      e.preventDefault();

      var name = document.getElementById('reg-name').value.trim();
      var email = document.getElementById('reg-email').value.trim();
      var password = document.getElementById('reg-password').value.trim();
      var confirm = document.getElementById('reg-confirm').value.trim();

      if (password !== confirm) {
        showStatus('Passwords do not match. Please re-enter.', false);
        return;
      }

      var res = UserDB.register(name, email, password, 'user');

      if (res.success) {
        showStatus('✨ Account created! Welcome, ' + res.user.name + '. Launching Studio...', true);
        setTimeout(function() {
          window.location.href = 'studio.html';
        }, 500);
      } else {
        showStatus('⚠️ ' + (res.error || 'Failed to create account.'), false);
      }
    });
  </script>

</body>
</html>
