<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AI Interior Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0b0f19;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Ambient background gradient glow */
    .bg-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Navigation Back */
    .top-nav {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .nav-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s;
    }

    .nav-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Login Box Card */
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      margin-top: 40px;
    }

    /* Brand Header */
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #94a3b8;
    }

    /* Role Tabs: User vs Admin */
    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 22px;
    }

    .tab-btn {
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tab-btn.active.user-active {
      background: #6366f1;
      color: #fff;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
    }

    .tab-btn.active.admin-active {
      background: #d97706;
      color: #fff;
      box-shadow: 0 2px 10px rgba(217, 119, 6, 0.4);
    }

    /* Status Message Box */
    .status-msg {
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 18px;
      display: none;
      line-height: 1.4;
    }

    .status-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .status-msg.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      font-size: 16px;
      color: #64748b;
      pointer-events: none;
    }

    .text-input {
      width: 100%;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px 14px 12px 42px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: all 0.2s;
    }

    .text-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .pwd-toggle {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    /* 1-Click Credential Button */
    .quick-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 7px 12px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
      width: 100%;
      justify-content: center;
      transition: all 0.2s;
    }

    .quick-chip:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      transition: all 0.2s;
    }

    .submit-btn:hover {
      background: #4f46e5;
      transform: translateY(-1px);
    }

    .submit-btn.admin-mode {
      background: #d97706;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.4);
    }

    .submit-btn.admin-mode:hover {
      background: #b45309;
    }

    /* Bottom Switch Link */
    .bottom-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #94a3b8;
    }

    .bottom-link a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
    }

    .bottom-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- Top Nav -->
  <header class="top-nav">
    <a href="index.html" class="nav-link">
      <span>←</span> Back to Showcase
    </a>
    <a href="signup.html" class="nav-link" style="color: #a5b4fc; border-color: rgba(99, 102, 241, 0.3);">
      Create Account
    </a>
  </header>

  <!-- Login Card -->
  <div class="login-card">

    <!-- Role Switcher -->
    <div class="role-tabs">
      <button type="button" class="tab-btn active user-active" id="tab-user">
        <span>👤</span> User Login
      </button>
      <button type="button" class="tab-btn" id="tab-admin">
        <span>👑</span> Admin Login
      </button>
    </div>

    <!-- Brand Header -->
    <div class="brand-header">
      <div class="brand-icon" id="portal-icon">✨</div>
      <h1 class="brand-title" id="portal-title">User Sign In</h1>
      <p class="brand-subtitle" id="portal-subtitle">Access interactive 3D Interior Design Studio</p>
    </div>

    <!-- In-Card Status Message -->
    <div class="status-msg" id="status-box"></div>

    <!-- Login Form -->
    <form id="login-form">

      <!-- Email Field -->
      <div class="form-group">
        <label class="form-label" for="login-email" id="label-email">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input 
            type="email" 
            id="login-email" 
            class="text-input" 
            placeholder="sarah.miller@example.com" 
            required 
            autocomplete="email"
          >
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input 
            type="password" 
            id="login-password" 
            class="text-input" 
            placeholder="Enter password" 
            required 
            autocomplete="current-password"
          >
          <button type="button" class="pwd-toggle" id="btn-toggle-pwd" title="Show/Hide">👁</button>
        </div>
      </div>

      <!-- 1-Click Credential Fill Button -->
      <button type="button" class="quick-chip" id="btn-quick-fill">
        <span>⚡</span> <span id="quick-fill-label">1-Click Fill User Credentials</span>
      </button>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn" id="btn-submit">
        <span id="btn-icon">🚀</span> <span id="btn-label">Sign In & Launch 3D Studio</span>
      </button>

    </form>

    <!-- Switch to Sign Up -->
    <div class="bottom-link" id="signup-row">
      Don't have an account yet? 
      <a href="signup.html">Sign Up Free →</a>
    </div>

  </div>

  <!-- UserDB Service -->
  <script src="js/user-db.js"></script>

  <script>
    var currentRole = 'user'; // 'user' | 'admin'

    function showStatus(text, isSuccess) {
      var box = document.getElementById('status-box');
      box.textContent = text;
      box.className = 'status-msg ' + (isSuccess ? 'success' : 'error');
    }

    function clearStatus() {
      var box = document.getElementById('status-box');
      box.className = 'status-msg';
      box.textContent = '';
    }

    function setRole(role) {
      currentRole = role;
      clearStatus();

      var tabUser = document.getElementById('tab-user');
      var tabAdmin = document.getElementById('tab-admin');
      var portalIcon = document.getElementById('portal-icon');
      var portalTitle = document.getElementById('portal-title');
      var portalSubtitle = document.getElementById('portal-subtitle');
      var labelEmail = document.getElementById('label-email');
      var inputEmail = document.getElementById('login-email');
      var inputPwd = document.getElementById('login-password');
      var quickFillLabel = document.getElementById('quick-fill-label');
      var btnSubmit = document.getElementById('btn-submit');
      var btnIcon = document.getElementById('btn-icon');
      var btnLabel = document.getElementById('btn-label');
      var signupRow = document.getElementById('signup-row');

      if (role === 'admin') {
        tabUser.className = 'tab-btn';
        tabAdmin.className = 'tab-btn active admin-active';
        portalIcon.textContent = '👑';
        portalIcon.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
        portalTitle.textContent = 'Administrator Sign In';
        portalSubtitle.textContent = 'Authorized Studio Managers & User Records Access';
        labelEmail.textContent = 'Admin Email';
        inputEmail.placeholder = 'bhuvan@gmail.com';
        quickFillLabel.textContent = '1-Click Fill Admin Credentials (bhuvan@gmail.com)';
        btnSubmit.className = 'submit-btn admin-mode';
        btnIcon.textContent = '👑';
        btnLabel.textContent = 'Sign In to Admin Dashboard';
        signupRow.style.display = 'none';
      } else {
        tabAdmin.className = 'tab-btn';
        tabUser.className = 'tab-btn active user-active';
        portalIcon.textContent = '✨';
        portalIcon.style.background = 'linear-gradient(135deg, #6366f1, #8b5cf6)';
        portalTitle.textContent = 'User Sign In';
        portalSubtitle.textContent = 'Access interactive 3D Interior Design Studio';
        labelEmail.textContent = 'Email Address';
        inputEmail.placeholder = 'sarah.miller@example.com';
        quickFillLabel.textContent = '1-Click Fill User Credentials (sarah.miller@example.com)';
        btnSubmit.className = 'submit-btn';
        btnIcon.textContent = '🚀';
        btnLabel.textContent = 'Sign In & Launch 3D Studio';
        signupRow.style.display = 'block';
      }
    }

    // 1-Click Credential Fill
    document.getElementById('btn-quick-fill').addEventListener('click', function() {
      clearStatus();
      var inputEmail = document.getElementById('login-email');
      var inputPwd = document.getElementById('login-password');

      if (currentRole === 'admin') {
        inputEmail.value = 'bhuvan@gmail.com';
        inputPwd.value = 'Bhuvan@123';
        showStatus('Admin credentials filled. Click "Sign In to Admin Dashboard" below!', true);
      } else {
        inputEmail.value = 'sarah.miller@example.com';
        inputPwd.value = 'password123';
        showStatus('User credentials filled. Click "Sign In & Launch 3D Studio" below!', true);
      }
    });

    // Toggle Password Visibility
    document.getElementById('btn-toggle-pwd').addEventListener('click', function(e) {
      e.preventDefault();
      var input = document.getElementById('login-password');
      var isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
      this.textContent = isPwd ? '🙈' : '👁';
    });

    // Tab buttons
    document.getElementById('tab-user').addEventListener('click', function() { setRole('user'); });
    document.getElementById('tab-admin').addEventListener('click', function() { setRole('admin'); });

    // Handle Login Submission
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      clearStatus();

      var email = document.getElementById('login-email').value.trim();
      var password = document.getElementById('login-password').value.trim();

      if (!email || !password) {
        showStatus('Please enter both email and password.', false);
        return;
      }

      var res = UserDB.authenticate(email, password);

      if (res.success) {
        var user = res.user;
        var isAdmin = user.role === 'admin' || user.email.toLowerCase() === 'bhuvan@gmail.com';

        if (isAdmin) {
          showStatus('✨ Welcome Administrator Bhuvan! Opening Admin Dashboard...', true);
          setTimeout(function() {
            window.location.href = 'admin.html';
          }, 400);
        } else {
          showStatus('✨ Welcome ' + user.name + '! Launching 3D Interior Studio...', true);
          setTimeout(function() {
            window.location.href = 'studio.html';
          }, 400);
        }
      } else {
        showStatus('⚠️ ' + (res.error || 'Authentication failed. Please verify credentials.'), false);
      }
    });

    // Check query params on load
    window.addEventListener('DOMContentLoaded', function() {
      var params = new URLSearchParams(window.location.search);
      var role = params.get('role');
      if (role === 'admin' || params.get('redirect') === 'admin.html') {
        setRole('admin');
      } else {
        setRole('user');
      }
    });
  </script>

</body>
</html>
